name: System Automation Workflow

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-scripts:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false

    steps:
      # 1️⃣ Checkout del código
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Ejecutar script Linux
      - name: Ejecutar script Linux
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          MY_SECRET: ${{ secrets.MY_SECRET_KEY }}
        run: |
          echo "Ejecutando Linux..."
          mkdir -p logs
          chmod +x scripts/script-linux.sh
          ./scripts/script-linux.sh > logs/salida-linux.txt 2>&1

      # 3️⃣ Ejecutar script Windows
      - name: Ejecutar script Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          MY_SECRET: ${{ secrets.MY_SECRET_KEY }}
        run: |
          Write-Host "Ejecutando Windows..."
          New-Item -ItemType Directory -Path logs -ErrorAction SilentlyContinue
          ./scripts/script-windows.ps1 *> logs\salida-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 4️⃣ Subir logs combinados como artifact
      - name: Subir logs como artifact
        shell: bash
        run: |
          mkdir -p logs_combined
          if [ -f logs/salida-linux.txt ]; then cp logs/salida-linux.txt logs_combined/; fi
          if [ -f logs/salida-windows.txt ]; then cp logs/salida-windows.txt logs_combined/; fi
        uses: actions/upload-artifact@v4
        with:
          name: system-logs
          path: logs_combined/
