name: System Automation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  APP_NAME: "Docker Automation"
  VERSION: "1.0.0"

jobs:
  system-scripts:
    name: Ejecutar scripts del sistema
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    
    steps:
      # Checkout del código
      - name: 📥 Checkout del código
        uses: actions/checkout@v3

      # Variables de entorno y secret
      - name: 🛠 Preparar variables y secret
        run: |
          echo "Aplicación: $APP_NAME"
          echo "Versión: $VERSION"
        env:
          MY_SECRET: ${{ secrets.MY_SECRET_KEY }}

      # Step Linux
      - name: 🐧 Ejecutar script Linux
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p logs
          chmod +x ./scripts/script-linux.sh
          ./scripts/script-linux.sh > logs/salida-linux.txt 2>&1 || echo "⚠️ Script Linux falló, revisar logs."

      # Step Windows
      - name: 🪟 Ejecutar script Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "Ejecutando Windows..."
          if (!(Test-Path -Path logs)) { New-Item -ItemType Directory -Path logs }
          try {
            .\scripts\script-windows.ps1 4>&1 | Out-File -FilePath logs\salida-windows.txt -Encoding utf8
            Write-Host "Script completado correctamente."
          } catch {
            Write-Host "⚠️ El script falló, revisar logs en logs\salida-windows.txt"
          }

      # Subir artifacts
      - name: 📤 Subir logs como artifact
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}
          path: logs
          retention-days: 5
