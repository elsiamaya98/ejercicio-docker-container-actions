name: Docker Container Action

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      # Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Build Docker image
      - name: Build Docker Image
        run: docker build -t demo-container .

      # Run Docker container
      - name: Run Docker Container
        run: docker run --name demo-container-run --rm demo-container

      # Monitor container resources (if running in background)
      #- name: Monitor Container Resources
      #  run: docker stats --no-stream demo-container-run
